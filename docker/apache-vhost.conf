<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defesa em profundidade: uploads de usuário (logo da empresa, foto do
    # cliente) ficam em public/storage. A validação de upload já bloqueia
    # qualquer coisa que não seja jpg/jpeg/png/webp, mas se algum dia essa
    # validação falhar/for enfraquecida, isto impede que um .php enviado
    # ali seja executado pelo Apache.
    <Directory /var/www/html/public/storage>
        <FilesMatch "\.(php|phtml|php[0-9]?|phar|pht)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
