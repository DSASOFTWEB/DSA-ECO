# Nginx (host) — reverse proxy para o container parque_prod_app (127.0.0.1:9080).
# Domínio: softplanerp.com.br
#
# Instalar na VPS:
#   cp deploy/nginx-dsa-eco.conf /etc/nginx/sites-available/dsa-eco
#   ln -sf /etc/nginx/sites-available/dsa-eco /etc/nginx/sites-enabled/dsa-eco
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d softplanerp.com.br -d www.softplanerp.com.br

server {
    listen 80;
    listen [::]:80;
    server_name softplanerp.com.br www.softplanerp.com.br;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
