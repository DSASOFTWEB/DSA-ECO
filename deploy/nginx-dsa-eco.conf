# Nginx (host) — reverse proxy para o container parque_prod_app (127.0.0.1:9080).
# Instalar na VPS:
#   cp deploy/nginx-dsa-eco.conf /etc/nginx/sites-available/dsa-eco
#   # edite server_name com o domínio real
#   ln -sf /etc/nginx/sites-available/dsa-eco /etc/nginx/sites-enabled/dsa-eco
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d SEU_DOMINIO.com.br
#
# Pasta do código Docker: /var/www/dsa-eco (não precisa ser DocumentRoot do Nginx).

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO.com.br www.SEU_DOMINIO.com.br;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
